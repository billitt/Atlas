[package]
name = "mcp-common"
version = "0.1.0"
edition = "2021"
description = "Shared security middleware for Atlas MCP servers"

[dependencies]
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
http = "1"
rustls = "0.23"
rustls-pemfile = "2"
regex = "1"
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
dashmap = "5"
governor = "0.6"

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
