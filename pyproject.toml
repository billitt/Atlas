[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — Global Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration & construction
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "beeai-framework>=0.1.79",
    # Protocols
    "a2a-sdk[http-server]>=1.0",
    "mcp[cli]>=1.27",
    # LLM & embeddings (runtime via Ollama)
    "httpx>=0.28",
    # Memory & data
    "chromadb>=0.6",
    "sqlmodel>=0.0.22",
    "docling>=2.0",
    # Scheduling & interfaces
    "apscheduler>=3.11",
    "streamlit>=1.41",
    "typer>=0.15",
    "feedparser>=6.0",
    # Observability
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    # Config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
atlas-verify-ollama = "scripts.verify_ollama:main"
atlas-langgraph-hello = "examples.langgraph_hello:main"
atlas-beeai-hello = "examples.beeai_hello:main"
atlas-market-agent-demo = "examples.market_agent_demo:main"
atlas-a2a-demo = "examples.a2a_demo:main"
atlas-synthesis-demo = "examples.synthesis_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "examples", "scripts", "protocols", "agents", "orchestration"]

[tool.ruff]
line-length = 100
target-version = "py311"
