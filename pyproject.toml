[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — Global Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration & construction
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "beeai-framework>=0.1.79", #Phase 0 only
    # Protocols
    "a2a-sdk[http-server]>=1.0",
    "mcp[cli]>=1.27",
    # LLM & embeddings (runtime via Ollama)
    "httpx>=0.28",
    # Host capability detection (auto-sizes agent concurrency)
    "psutil>=5.9",
    # Memory & data
    "chromadb>=0.6",
    "sqlmodel>=0.0.22",
    "docling>=2.0",
    # Scheduling & interfaces
    "apscheduler>=3.11",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "feedparser>=6.0",
    # Observability
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    # Config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
atlas = "cli.main:app"
atlas-verify-ollama = "scripts.verify_ollama:main"
atlas-langgraph-hello = "examples.langgraph_hello:main"
atlas-beeai-hello = "examples.beeai_hello:main"
atlas-market-agent-demo = "examples.market_agent_demo:main"
atlas-a2a-demo = "examples.a2a_demo:main"
atlas-synthesis-demo = "examples.synthesis_demo:main"
atlas-memory-demo = "examples.memory_demo:main"
atlas-edgar-demo = "examples.edgar_demo:main"
atlas-guardian-demo = "examples.guardian_demo:main"
atlas-briefing-demo = "examples.briefing_demo:main"
atlas-scheduler-demo = "examples.scheduler_demo:main"
atlas-alert-demo = "examples.alert_demo:main"
atlas-alert-watch-demo = "examples.alert_watch_demo:main"
atlas-tracing-demo = "examples.tracing_demo:main"
atlas-taiwan-demo = "examples.taiwan_demo:main"
atlas-api = "api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "examples", "scripts", "protocols", "agents", "orchestration", "memory", "observability", "cli", "ingestion", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"
